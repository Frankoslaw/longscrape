[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "longscrape-tdd"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Franciszek Łopuszański", email = "franopusz2006@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "parsel>=1.11.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/longscrape"]

[tool.pytest.ini_options]
testpaths = ["tests"]
