[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "longscrape"
version = "0.2.2"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Franciszek Łopuszański", email = "franopusz2006@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "parsel>=1.11.0",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.61.0",
]
browser-capture = [
    "pydantic>=2.13.4",
    "fastapi[standard]>=0.141.1",
]
mongodb = [
    "pymongo>=4.17.0",
]
dramatiq = [
        "dramatiq[redis,watch]>=2.2.0",
]
structlog = [
    "structlog>=25.0.0",
]
otel = [
    "opentelemetry-api>=1.30.0",
    "opentelemetry-sdk>=1.30.0",
]
all = [
    "longscrape[browser,browser-capture,mongodb,dramatiq,structlog,otel]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/longscrape"]
