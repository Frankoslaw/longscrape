[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "longscrape"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Franciszek Łopuszański", email = "franopusz2006@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "longscrape-core",
    "httpx>=0.28.1",
    "parsel>=1.11.0",
    "pydantic>=2.13.4",
]

[project.optional-dependencies]
playwright = [
    "playwright>=1.61.0",
]
patchright = [
    "patchright>=1.61.2",
    "playwright>=1.61.0",
]
stealth = [
    "playwright>=1.61.0",
    "playwright-stealth>=2.0.3",
]
fastapi = [
    "fastapi[standard]>=0.141.1",
]
mongodb = [
    "pymongo>=4.17.0",
]
redis = [
    "redis>=7.2.0",
]
all = [
    "longscrape[playwright,patchright,stealth,fastapi,mongodb,redis]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/longscrape"]
