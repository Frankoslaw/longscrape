[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "longscrape-scrapy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Franciszek Łopuszański", email = "franopusz2006@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "longscrape-core",
    "scrapy>=2.17.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/longscrape_scrapy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
