[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "longscrape"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Big Time Public License" }
authors = [
    { name = "Franciszek Łopuszański", email = "franopusz2006@gmail.com" }
]
dependencies = [
    "asyncio>=4.0.0",
    "httpx>=0.28.1",
    "parsel>=1.11.0",
    "patchright>=1.61.2",
    "playwright>=1.61.0",
    "playwright-stealth>=2.0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/longscrape"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pyre-check>=0.9.25",
    "ruff>=0.16.0",
]
