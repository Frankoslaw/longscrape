[project]
name = "longscrape-workspace"
version = "0.2.2"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Franciszek Łopuszański", email = "franopusz2006@gmail.com" }
]
requires-python = ">=3.14"

[dependency-groups]
dev = [
    "longscrape[all]",
    "longscrape-tdd[all]",
    "ipykernel>=7.3.0",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pandas-stubs>=3.0.5.260730",
    "pre-commit>=4.6.2",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
    "patchright>=1.61.2",
    "playwright>=1.62.0",
    "mkdocs>=1.6.1",
    "mkdocstrings[python]>=1.0.6"
]

[tool.uv.workspace]
members = [
    "packages/longscrape",
    "packages/longscrape-tdd",
]

[tool.uv.sources]
longscrape = { workspace = true }
longscrape-tdd = { workspace = true }

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
include = [
    "packages",
    "examples",
    "playbooks",
]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/build",
    "**/dist",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]
extend-select = ["I"]
