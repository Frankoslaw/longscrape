[project]
name = "longscrape-workspace"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Big Time Public License" }
authors = [
    { name = "Franciszek Łopuszański", email = "franopusz2006@gmail.com" }
]

[dependency-groups]
dev = [
    "longscrape[all]",
    "longscrape-core",
    "longscrape-scrapy",
    "ipykernel>=7.3.0",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "pandas-stubs>=3.0.5.260730",
    "pre-commit>=4.6.1",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "scrapy>=2.17.0",
    "scrapy-playwright>=0.0.48",
    "coloredlogs>=15.0.1",
]

[tool.uv.workspace]
members = [
    "packages/longscrape",
    "packages/longscrape_core",
    "packages/longscrape_scrapy",
]

[tool.uv.sources]
longscrape = { workspace = true }
longscrape-core = { workspace = true }
longscrape-scrapy = { workspace = true }

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
include = [
    "packages",
    "examples",
    "playbooks",
]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/build",
    "**/dist",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]
extend-select = ["I"]
